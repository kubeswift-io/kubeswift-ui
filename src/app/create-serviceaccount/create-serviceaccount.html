<app-form-shell
  [title]="isEdit() ? 'Edit service account' : 'New service account'"
  sub="a ServiceAccount"
  [clusters]="clusters()" [cluster]="cluster()" [edit]="isEdit()"
  [view]="view()" [yaml]="yamlText()" [error]="error()" [canWrite]="canWrite()"
  [busy]="busy()" [canSave]="canSave()" [saveLabel]="isEdit() ? 'Apply' : 'Create service account'"
  (clusterChange)="selectCluster($event)" (viewChange)="setView($event)" (yamlChange)="yamlText.set($event)"
  (save)="save()" (close)="closed.emit()"
>
  <div class="row2">
    <label class="field">
      <span>Namespace</span>
      @if (isEdit()) { <input [value]="namespace()" disabled /> } @else {
        <select [value]="namespace()" (change)="namespace.set($any($event.target).value)">
          @for (ns of namespaces(); track ns) { <option [value]="ns">{{ ns }}</option> }
        </select>
      }
    </label>
    <label class="field">
      <span>Name *</span>
      <input placeholder="my-sa" [value]="name()" (input)="name.set($any($event.target).value)" [disabled]="isEdit()" />
    </label>
  </div>

  <label class="field">
    <span>Automount API token</span>
    <select [value]="automount()" (change)="automount.set($any($event.target).value)">
      <option value="default">cluster default</option>
      <option value="true">true</option>
      <option value="false">false</option>
    </select>
  </label>

  <h4>Image pull secrets</h4>
  @for (s of pullSecrets(); track $index) {
    <div class="ports">
      <div class="prow" style="grid-template-columns: 1fr 28px">
        <input placeholder="regcreds" [value]="s" (input)="setPS($index, $any($event.target).value)" />
        <button class="rowx" (click)="removePS($index)" title="Remove"><mat-icon>close</mat-icon></button>
      </div>
    </div>
  }
  <button class="link" style="margin: 0" (click)="addPS()">+ Add pull secret</button>
</app-form-shell>
