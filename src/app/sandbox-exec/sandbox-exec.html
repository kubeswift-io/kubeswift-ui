<div class="backdrop" (click)="closed.emit()"></div>

<div class="console" role="dialog" aria-label="Sandbox shell">
  <header>
    <span class="title">Shell — {{ name() }}</span>
    <span class="status" [class]="status()">{{ status() }}</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="closed.emit()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <div #term class="term"></div>
  <footer>Interactive shell over vsock. Ctrl-D or "exit" to end the session.</footer>
</div>
