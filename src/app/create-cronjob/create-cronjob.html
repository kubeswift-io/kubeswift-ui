<app-form-shell
  [title]="isEdit() ? 'Edit cron job' : 'New cron job'" sub="a batch/v1 CronJob"
  [clusters]="clusters()" [cluster]="cluster()" [edit]="isEdit()"
  [view]="view()" [yaml]="yamlText()" [error]="error()" [canWrite]="canWrite()"
  [busy]="busy()" [canSave]="canSave()" [saveLabel]="isEdit() ? 'Apply' : 'Create cron job'"
  (clusterChange)="selectCluster($event)" (viewChange)="setView($event)" (yamlChange)="yamlText.set($event)"
  (save)="save()" (close)="closed.emit()"
>
  <div class="row2">
    <label class="field"><span>Namespace</span>
      @if (isEdit()) { <input [value]="namespace()" disabled /> } @else {
        <select [value]="namespace()" (change)="namespace.set($any($event.target).value)">@for (ns of namespaces(); track ns) { <option [value]="ns">{{ ns }}</option> }</select>
      }
    </label>
    <label class="field"><span>Name *</span><input placeholder="my-cronjob" [value]="name()" (input)="name.set($any($event.target).value)" [disabled]="isEdit()" /></label>
  </div>
  <label class="field"><span>Schedule (cron) *</span><input placeholder="*/5 * * * *" [value]="schedule()" (input)="schedule.set($any($event.target).value)" /></label>
  <div class="row2">
    <label class="field"><span>Concurrency</span>
      <select [value]="concurrency()" (change)="concurrency.set($any($event.target).value)"><option value="Allow">Allow</option><option value="Forbid">Forbid</option><option value="Replace">Replace</option></select>
    </label>
    <label class="check" style="margin-top: 22px"><input type="checkbox" [checked]="suspend()" (change)="suspend.set($any($event.target).checked)" /><span>Suspend</span></label>
  </div>
  <app-pod-template [value]="podSpecInput()" />
</app-form-shell>
