<div class="backdrop" (click)="closed.emit()"></div>
<aside class="drawer">
  <header>
    <div class="title">
      <span class="name">New sandbox pool</span>
      <span class="sub">pre-booted warm microVM slots</span>
    </div>
    <select class="cluster" [value]="cluster()" (change)="selectCluster($any($event.target).value)" title="Target cluster">
      @for (c of clusters(); track c.name) {
        <option [value]="c.name">{{ c.name }}{{ c.ready ? '' : ' (unreachable)' }}</option>
      }
    </select>
    <button class="icon" (click)="closed.emit()" title="Close"><mat-icon>close</mat-icon></button>
  </header>

  @if (error(); as e) {
    <div class="banner error"><mat-icon>error</mat-icon> <span>{{ e }}</span></div>
  }

  <div class="body">
    <div class="row2">
      <label class="field">
        <span>Namespace</span>
        <select [value]="namespace()" (change)="namespace.set($any($event.target).value)">
          @for (ns of namespaces(); track ns) {
            <option [value]="ns">{{ ns }}</option>
          }
        </select>
      </label>
      <label class="field">
        <span>Name *</span>
        <input placeholder="ci-runners" [value]="name()" (input)="name.set($any($event.target).value)" />
      </label>
    </div>

    <label class="field">
      <span>OCI image *</span>
      <input placeholder="docker.io/library/alpine:3.20" [value]="image()" (input)="image.set($any($event.target).value)" />
    </label>

    <div class="row2">
      <label class="field">
        <span>vCPUs</span>
        <input type="number" min="1" [value]="cpu() || ''" (input)="cpu.set(+$any($event.target).value || 0)" />
      </label>
      <label class="field">
        <span>Memory</span>
        <input placeholder="512Mi" [value]="memory()" (input)="memory.set($any($event.target).value)" />
      </label>
    </div>

    <div class="row2">
      <label class="field">
        <span>Network</span>
        <select [value]="networkMode()" (change)="networkMode.set($any($event.target).value)">
          <option value="restricted">restricted (default)</option>
          <option value="open">open</option>
          <option value="none">none</option>
        </select>
      </label>
      <label class="field">
        <span>Rootfs delivery</span>
        <select [value]="rootfsMode()" (change)="rootfsMode.set($any($event.target).value)">
          <option value="">block (default)</option>
          <option value="virtiofs">virtiofs</option>
        </select>
      </label>
    </div>

    <h4>Warm slots</h4>
    <div class="row2">
      <label class="field">
        <span>Min warm</span>
        <input type="number" min="0" [value]="minWarm()" (input)="minWarm.set(+$any($event.target).value || 0)" />
      </label>
      <label class="field">
        <span>Max warm (0 = unbounded)</span>
        <input type="number" min="0" [value]="maxWarm()" (input)="maxWarm.set(+$any($event.target).value || 0)" />
      </label>
    </div>

    <h4>GPU &amp; model (optional)</h4>
    <label class="field">
      <span>GPU profile — each slot holds a GPU (warm GPU pool)</span>
      <select [value]="gpuProfileRef()" (change)="gpuProfileRef.set($any($event.target).value)">
        <option value="">— none —</option>
        @for (g of gpuProfiles(); track g) {
          <option [value]="g">{{ g }}</option>
        }
      </select>
    </label>
    <div class="row2">
      <label class="field">
        <span>Model artifact (OCI)</span>
        <input placeholder="ghcr.io/org/model:tag" [value]="modelRef()" (input)="modelRef.set($any($event.target).value)" />
      </label>
      <label class="field">
        <span>Mount path</span>
        <input placeholder="/model" [value]="modelMount()" (input)="modelMount.set($any($event.target).value)" />
      </label>
    </div>
    <label class="field">
      <span>Image pull secret (optional)</span>
      <input placeholder="regcreds" [value]="imagePullSecret()" (input)="imagePullSecret.set($any($event.target).value)" />
    </label>
  </div>

  <div class="actions">
    <button class="primary" [disabled]="!canCreate() || busy()" (click)="create()">
      {{ busy() ? 'Creating…' : 'Create sandbox pool' }}
    </button>
    <button class="ghost" (click)="closed.emit()">Cancel</button>
    <button class="link" (click)="advanced.emit()" title="Switch to the raw YAML editor">Edit as YAML</button>
  </div>
</aside>
