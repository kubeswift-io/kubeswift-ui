<app-form-shell
  [title]="isEdit() ? 'Edit seed profile' : 'New seed profile'"
  sub="a SwiftSeedProfile cloud-init seed"
  [clusters]="clusters()"
  [cluster]="cluster()"
  [edit]="isEdit()"
  [view]="view()"
  [yaml]="yamlText()"
  [error]="error()"
  [canWrite]="canWrite()"
  [busy]="busy()"
  [canSave]="canSave()"
  [saveLabel]="isEdit() ? 'Apply' : 'Create seed profile'"
  (clusterChange)="selectCluster($event)"
  (viewChange)="setView($event)"
  (yamlChange)="yamlText.set($event)"
  (save)="save()"
  (close)="closed.emit()"
>
  <div class="row2">
    <label class="field">
      <span>Namespace</span>
      @if (isEdit()) {
        <input [value]="namespace()" disabled />
      } @else {
        <select [value]="namespace()" (change)="namespace.set($any($event.target).value)">
          @for (ns of namespaces(); track ns) {
            <option [value]="ns">{{ ns }}</option>
          }
        </select>
      }
    </label>
    <label class="field">
      <span>Name *</span>
      <input
        placeholder="web-seed"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        [disabled]="isEdit()"
      />
    </label>
  </div>

  <p class="hint">
    Datasource: NoCloud. Inline data below; toggle to YAML for secret/configMap references.
  </p>

  <label class="field">
    <span>user-data * (cloud-config)</span>
    <textarea
      rows="8"
      [value]="userData()"
      (input)="userData.set($any($event.target).value)"
    ></textarea>
  </label>
  <label class="field">
    <span>meta-data (optional)</span>
    <textarea
      rows="3"
      placeholder="instance-id: web-01&#10;local-hostname: web-01"
      [value]="metaData()"
      (input)="metaData.set($any($event.target).value)"
    ></textarea>
  </label>
  <label class="field">
    <span>network-config (optional)</span>
    <textarea
      rows="3"
      placeholder="version: 2&#10;ethernets: …"
      [value]="networkData()"
      (input)="networkData.set($any($event.target).value)"
    ></textarea>
  </label>
</app-form-shell>
