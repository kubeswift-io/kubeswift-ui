<div class="backdrop" (click)="closed.emit()"></div>
<aside class="drawer">
  <header>
    <div class="title">
      <span class="name">New {{ kind() === 'pool' ? 'warm pool' : 'sandbox' }}</span>
      <span class="sub">create a {{ kind() === 'pool' ? 'SwiftSandboxPool' : 'SwiftSandbox' }}</span>
    </div>
    <select class="cluster" [value]="cluster()" (change)="cluster.set($any($event.target).value)" title="Target cluster">
      <option value="" disabled>cluster…</option>
      @for (c of clusters(); track c.name) {
        <option [value]="c.name">{{ c.name }}{{ c.ready ? '' : ' (unreachable)' }}</option>
      }
    </select>
    <button class="icon" (click)="closed.emit()" title="Close"><mat-icon>close</mat-icon></button>
  </header>

  @if (error(); as e) {
    <div class="banner error"><mat-icon>error</mat-icon> <span>{{ e }}</span></div>
  }

  <div class="body">
    <div class="kindtabs">
      <button [class.on]="kind() === 'sandbox'" (click)="setKind('sandbox')">Sandbox</button>
      <button [class.on]="kind() === 'pool'" (click)="setKind('pool')">Warm pool</button>
    </div>

    <div class="row2">
      <label class="field">
        <span>Namespace</span>
        <input [value]="namespace()" (input)="namespace.set($any($event.target).value)" />
      </label>
      <label class="field">
        <span>Name</span>
        <input placeholder="my-sandbox" [value]="name()" (input)="name.set($any($event.target).value)" />
      </label>
    </div>

    <label class="field">
      <span>Image</span>
      <input placeholder="docker.io/library/alpine:3.20" [value]="image()" (input)="image.set($any($event.target).value)" />
    </label>

    @if (kind() === 'sandbox') {
      <div class="row2">
        <label class="field">
          <span>Command</span>
          <input placeholder="sh -c" [value]="command()" (input)="command.set($any($event.target).value)" />
        </label>
        <label class="field">
          <span>Argument</span>
          <input placeholder="echo hello" [value]="argument()" (input)="argument.set($any($event.target).value)" />
        </label>
      </div>
      <label class="field">
        <span>Check out from pool (optional)</span>
        <input placeholder="pool name — sub-second checkout" [value]="poolRef()" (input)="poolRef.set($any($event.target).value)" />
      </label>
    } @else {
      <div class="row2">
        <label class="field">
          <span>Min warm</span>
          <input type="number" min="0" [value]="minWarm()" (input)="minWarm.set(+$any($event.target).value)" />
        </label>
        <label class="field">
          <span>Max warm (0 = no cap)</span>
          <input type="number" min="0" [value]="maxWarm()" (input)="maxWarm.set(+$any($event.target).value)" />
        </label>
      </div>
    }

    <div class="row3">
      <label class="field">
        <span>Network</span>
        <select [value]="networkMode()" (change)="networkMode.set($any($event.target).value)">
          <option value="restricted">restricted</option>
          <option value="open">open</option>
          <option value="none">none</option>
        </select>
      </label>
      <label class="field">
        <span>vCPU</span>
        <input type="number" min="1" [value]="cpu()" (input)="cpu.set(+$any($event.target).value)" />
      </label>
      <label class="field">
        <span>Memory (MiB)</span>
        <input type="number" min="128" [value]="memoryMib()" (input)="memoryMib.set(+$any($event.target).value)" />
      </label>
    </div>
  </div>

  <footer>
    <button class="ghost" (click)="closed.emit()">Cancel</button>
    <button class="primary" [disabled]="!canCreate() || busy()" (click)="create()">
      {{ busy() ? 'Creating…' : 'Create' }}
    </button>
  </footer>
</aside>
