<app-form-shell
  [title]="isEdit() ? 'Edit kernel' : 'New kernel'"
  sub="a SwiftKernel OCI artifact"
  [clusters]="clusters()"
  [cluster]="cluster()"
  [edit]="isEdit()"
  [view]="view()"
  [yaml]="yamlText()"
  [error]="error()"
  [canWrite]="canWrite()"
  [busy]="busy()"
  [canSave]="canSave()"
  [saveLabel]="isEdit() ? 'Apply' : 'Create kernel'"
  (clusterChange)="selectCluster($event)"
  (viewChange)="setView($event)"
  (yamlChange)="yamlText.set($event)"
  (save)="save()"
  (close)="closed.emit()"
>
  <div class="row2">
    <label class="field">
      <span>Namespace</span>
      @if (isEdit()) {
        <input [value]="namespace()" disabled />
      } @else {
        <select [value]="namespace()" (change)="namespace.set($any($event.target).value)">
          @for (ns of namespaces(); track ns) {
            <option [value]="ns">{{ ns }}</option>
          }
        </select>
      }
    </label>
    <label class="field">
      <span>Name *</span>
      <input
        placeholder="faas-minimal"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        [disabled]="isEdit()"
      />
    </label>
  </div>

  <label class="field">
    <span>OCI image *</span>
    <input
      placeholder="ghcr.io/kubeswift-io/kubeswift/kernels/faas:6.6.1"
      [value]="image()"
      (input)="image.set($any($event.target).value)"
    />
  </label>

  <div class="row2">
    <label class="field">
      <span>Profile (optional)</span>
      <input
        placeholder="faas-minimal"
        [value]="profile()"
        (input)="profile.set($any($event.target).value)"
      />
    </label>
    <label class="field">
      <span>Pull secret (optional)</span>
      <input
        placeholder="regcreds"
        [value]="pullSecret()"
        (input)="pullSecret.set($any($event.target).value)"
      />
    </label>
  </div>

  <label class="field">
    <span>Kernel cmdline (optional)</span>
    <input
      placeholder="console=ttyS0 reboot=k panic=1"
      [value]="cmdline()"
      (input)="cmdline.set($any($event.target).value)"
    />
  </label>
  <p class="hint">
    A tag change alone won't re-pull an existing kernel — the pull Job is keyed on name + node.
  </p>
</app-form-shell>
