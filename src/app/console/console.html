<div class="backdrop" (click)="closed.emit()"></div>

<div class="console" role="dialog" aria-label="VM serial console">
  <header>
    <span class="title">Serial console — {{ ref().name }}</span>
    <span class="status" [class]="status()">{{ status() }}</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="closed.emit()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <div #term class="term"></div>
  <footer>Press Enter if the screen is blank. Control keys go to the guest.</footer>
</div>
