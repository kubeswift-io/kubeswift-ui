<app-form-shell
  [title]="isEdit() ? 'Edit config map' : 'New config map'"
  sub="a ConfigMap"
  [clusters]="clusters()"
  [cluster]="cluster()"
  [edit]="isEdit()"
  [view]="view()"
  [yaml]="yamlText()"
  [error]="error()"
  [canWrite]="canWrite()"
  [busy]="busy()"
  [canSave]="canSave()"
  [saveLabel]="isEdit() ? 'Apply' : 'Create config map'"
  (clusterChange)="selectCluster($event)"
  (viewChange)="setView($event)"
  (yamlChange)="yamlText.set($event)"
  (save)="save()"
  (close)="closed.emit()"
>
  <div class="row2">
    <label class="field">
      <span>Namespace</span>
      @if (isEdit()) {
        <input [value]="namespace()" disabled />
      } @else {
        <select [value]="namespace()" (change)="namespace.set($any($event.target).value)">
          @for (ns of namespaces(); track ns) {
            <option [value]="ns">{{ ns }}</option>
          }
        </select>
      }
    </label>
    <label class="field">
      <span>Name *</span>
      <input
        placeholder="my-config"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        [disabled]="isEdit()"
      />
    </label>
  </div>

  <h4>Data</h4>
  @for (e of entries(); track $index) {
    <div class="kvblock">
      <div class="kvhead">
        <input
          class="kvkey"
          placeholder="key (e.g. app.conf)"
          [value]="e.key"
          (input)="setEntry($index, 'key', $any($event.target).value)"
        />
        <button class="rowx" (click)="removeEntry($index)" title="Remove"><mat-icon>close</mat-icon></button>
      </div>
      <textarea
        rows="3"
        placeholder="value"
        [value]="e.value"
        (input)="setEntry($index, 'value', $any($event.target).value)"
      ></textarea>
    </div>
  }
  <button class="link" style="margin: 0" (click)="addEntry()">+ Add entry</button>
</app-form-shell>
