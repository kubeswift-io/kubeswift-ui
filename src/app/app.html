@if (auth.enabled && !auth.isAuthenticated()) {
  <div class="login">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M50,4 L89.8,27 L89.8,73 L50,96 L10.2,73 L10.2,27 Z M34,30 L70,50 L34,70 L48,70 L54,50 L48,30 Z"/></svg>
    <h1 class="wordmark">Kube<span class="swift">Swift</span></h1>
    <p>Sign in to manage the fleet.</p>
    <button class="signin" (click)="auth.login()">Sign in</button>
    @if (auth.error(); as err) {
      <p class="signin-error" role="alert">{{ err }}</p>
    }
  </div>
} @else {
  <mat-toolbar class="topbar">
    <a class="brand" routerLink="/" aria-label="KubeSwift overview">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M50,4 L89.8,27 L89.8,73 L50,96 L10.2,73 L10.2,27 Z M34,30 L70,50 L34,70 L48,70 L54,50 L48,30 Z"/></svg>
      <span class="wordmark">Kube<span class="swift">Swift</span></span>
    </a>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Overview</a
      >
      <a routerLink="/fleet" routerLinkActive="active">Fleet</a>
      <a routerLink="/explorer" routerLinkActive="active">Explorer</a>
      <a routerLink="/migrations" routerLinkActive="active">Migrations</a>
      <a routerLink="/access" routerLinkActive="active">Access</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </nav>
    <span class="spacer"></span>
    @if (auth.enabled && auth.user(); as user) {
      <span class="user" [title]="user">
        <mat-icon class="user-icon">account_circle</mat-icon>{{ user }}
      </span>
      <button class="logout" (click)="auth.logout()" title="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    }
    <button
      class="theme-toggle"
      (click)="theme.toggle()"
      [title]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <span class="tag">v1alpha1</span>
  </mat-toolbar>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
}
