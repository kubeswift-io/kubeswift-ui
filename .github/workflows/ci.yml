name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. Without this the workflow inherits
# the repo/org default, which may be read-write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build (static)
        run: npx ng build
      # ubuntu-latest ships Chrome, so the Karma runner needs no extra setup.
      # podspec.spec.ts covers the PodSpec merge, where a silent regression means
      # the editor deletes fields the operator never touched.
      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
