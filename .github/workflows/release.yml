name: Release

# Build (and, off a branch/tag, push) the kubeswift-ui container image to GHCR.
# Mirrors the kubeswift repo's release-dev / release-stable image build:
#   - push to main  -> ghcr.io/projectbeskar/kubeswift-ui:sha-<short> + :latest
#   - push tag vX.Y.Z -> ghcr.io/projectbeskar/kubeswift-ui:vX.Y.Z
#   - pull_request  -> build only (no push), so a broken Dockerfile fails the PR
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/projectbeskar/kubeswift-ui

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tags
        id: meta
        run: |
          GIT_COMMIT="${{ github.sha }}"
          SHORT="$(echo "$GIT_COMMIT" | cut -c1-7)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"            # vX.Y.Z
            TAGS="${IMAGE}:${VERSION}"
          else
            VERSION="sha-${SHORT}"
            # Dev (main) tracks both an immutable sha tag and :latest.
            TAGS="$(printf '%s:sha-%s\n%s:latest' "$IMAGE" "$SHORT" "$IMAGE")"
          fi
          {
            echo "version=$VERSION"
            echo "git_commit=$GIT_COMMIT"
            echo "build_date=$BUILD_DATE"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRs build but do not push (no GHCR credentials needed to validate the
      # Dockerfile); pushes/tags log in and publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.git_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
