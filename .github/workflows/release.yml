name: Release

# Build (and, off a branch/tag, push) the kubeswift-ui container image to GHCR,
# and on a tag also publish the GitHub Release.
# Mirrors the kubeswift repo's release-dev / release-stable image build:
#   - push to main  -> ghcr.io/kubeswift-io/kubeswift-ui:sha-<short> + :latest
#   - push tag vX.Y.Z -> ghcr.io/kubeswift-io/kubeswift-ui:vX.Y.Z + a GitHub Release
#   - pull_request  -> build only (no push), so a broken Dockerfile fails the PR
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/kubeswift-io/kubeswift-ui

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tags
        id: meta
        run: |
          GIT_COMMIT="${{ github.sha }}"
          SHORT="$(echo "$GIT_COMMIT" | cut -c1-7)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"            # vX.Y.Z
            TAGS="${IMAGE}:${VERSION}"
          else
            VERSION="sha-${SHORT}"
            # Dev (main) tracks both an immutable sha tag and :latest.
            TAGS="$(printf '%s:sha-%s\n%s:latest' "$IMAGE" "$SHORT" "$IMAGE")"
          fi
          {
            echo "version=$VERSION"
            echo "git_commit=$GIT_COMMIT"
            echo "build_date=$BUILD_DATE"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRs build but do not push (no GHCR credentials needed to validate the
      # Dockerfile); pushes/tags log in and publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.git_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag pushes also publish the GitHub Release. The image is built first so a
  # release never points at a tag that failed to publish. "What's Changed" is
  # generated from the merged PRs since the previous tag; the body below adds
  # the pull ref and the gateway compatibility floor.
  github-release:
    name: Create GitHub Release
    needs: build-and-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kubeswift-ui ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Image

            ```
            ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.version }}
            ```

            Deploy with the kubeswift chart, preserving your existing values:

            ```bash
            helm upgrade kubeswift oci://ghcr.io/kubeswift-io/charts/kubeswift \
              -n kubeswift-system \
              -f <(helm get values kubeswift -n kubeswift-system -o yaml) \
              --set ui.image.tag=${{ needs.build-and-push.outputs.version }}
            ```

            ## Compatibility

            kubeswift-ui is released independently of the kubeswift chart and
            gateway. Check the notes below for the minimum gateway version this
            release needs — the UI talks only to `kubeswift-gateway`.

            Operator docs: [`docs/ui/`](https://github.com/kubeswift-io/kubeswift/tree/main/docs/ui)
